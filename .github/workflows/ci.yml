name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch makes the running job pointless, so cancel it rather than paying
# for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if the two disagree,
      # which is the point of running this on a build machine.
      - run: npm ci

      # Ordered cheapest-first, so an obvious break reports in seconds instead of after the build.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      # E2E runs last: it is the slowest gate, and it exercises the build the previous step proved.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
